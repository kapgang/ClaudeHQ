<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Assistant - Claude Code</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grid-bg"></div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Work Assistant</h1>
          <span>Claude Code Terminal</span>
        </div>
      </div>
      <div class="header-controls">
        <button id="startTerminal" class="btn-terminal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Start Claude Code
        </button>
        <button id="stopTerminal" class="btn-terminal btn-stop" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <rect x="6" y="6" width="12" height="12"/>
          </svg>
          Stop
        </button>
      </div>
    </header>

    <!-- Terminal -->
    <main class="terminal-wrapper">
      <div id="terminal"></div>
      <div id="terminalPlaceholder" class="terminal-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64">
          <polyline points="4 17 10 11 4 5"/>
          <line x1="12" y1="19" x2="20" y2="19"/>
        </svg>
        <h2>Claude Code Terminal</h2>
        <p>Click "Start Claude Code" to launch an interactive AI coding assistant</p>
        <span>Uses your Claude Code subscription - no additional API costs</span>
      </div>
    </main>
  </div>

  <!-- Terminal Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script>
    // Terminal state
    let term = null;
    let terminalWs = null;
    let terminalRunning = false;
    const fitAddon = new FitAddon.FitAddon();

    // DOM elements
    const terminalEl = document.getElementById('terminal');
    const terminalPlaceholder = document.getElementById('terminalPlaceholder');
    const startBtn = document.getElementById('startTerminal');
    const stopBtn = document.getElementById('stopTerminal');
    const ASSISTANT_DIR = 'C:\\Users\\kapla\\OneDrive\\Desktop\\Claude HQ\\Applications\\Assistant';

    // Initialize xterm
    function initTerminal() {
      if (term) return;

      term = new Terminal({
        cursorBlink: true,
        fontSize: 15,
        fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace",
        theme: {
          background: '#0a0a0f',
          foreground: '#e0e0e0',
          cursor: '#00b4d8',
          cursorAccent: '#0a0a0f',
          selectionBackground: 'rgba(0, 180, 216, 0.3)',
          black: '#1a1a24',
          red: '#ef4444',
          green: '#10b981',
          yellow: '#f59e0b',
          blue: '#3b82f6',
          magenta: '#a855f7',
          cyan: '#00b4d8',
          white: '#e0e0e0',
          brightBlack: '#4a4a5a',
          brightRed: '#f87171',
          brightGreen: '#34d399',
          brightYellow: '#fbbf24',
          brightBlue: '#60a5fa',
          brightMagenta: '#c084fc',
          brightCyan: '#22d3ee',
          brightWhite: '#ffffff'
        },
        allowProposedApi: true
      });

      term.loadAddon(fitAddon);
      term.loadAddon(new WebLinksAddon.WebLinksAddon());
      term.open(terminalEl);
      fitAddon.fit();

      // Handle window resize
      window.addEventListener('resize', () => {
        if (terminalRunning) {
          fitAddon.fit();
          if (terminalWs && terminalWs.readyState === WebSocket.OPEN) {
            terminalWs.send(JSON.stringify({
              type: 'resize',
              cols: term.cols,
              rows: term.rows
            }));
          }
        }
      });

      // Handle terminal input
      term.onData((data) => {
        if (terminalWs && terminalWs.readyState === WebSocket.OPEN) {
          terminalWs.send(JSON.stringify({ type: 'input', data }));
        }
      });
    }

    // Start terminal
    function startTerminalSession() {
      initTerminal();

      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      terminalWs = new WebSocket(`${wsProtocol}//${window.location.host}`);

      terminalWs.onopen = () => {
        term.clear();
        terminalPlaceholder.style.display = 'none';
        terminalEl.style.display = 'block';
        fitAddon.fit();

        terminalWs.send(JSON.stringify({
          type: 'start',
          workingDir: ASSISTANT_DIR
        }));

        // Send initial resize
        setTimeout(() => {
          fitAddon.fit();
          terminalWs.send(JSON.stringify({
            type: 'resize',
            cols: term.cols,
            rows: term.rows
          }));
          term.focus();
        }, 100);
      };

      terminalWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'output') {
            term.write(msg.data);
          } else if (msg.type === 'exit') {
            term.write('\r\n\x1b[33m[Session ended]\x1b[0m\r\n');
            stopTerminalSession();
          } else if (msg.type === 'started') {
            terminalRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
          }
        } catch (e) {
          console.error('Terminal message error:', e);
        }
      };

      terminalWs.onclose = () => {
        stopTerminalSession();
      };

      terminalWs.onerror = (error) => {
        console.error('Terminal WebSocket error:', error);
        term.write('\r\n\x1b[31m[Connection error]\x1b[0m\r\n');
        stopTerminalSession();
      };
    }

    // Stop terminal
    function stopTerminalSession() {
      terminalRunning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      if (terminalWs) {
        terminalWs.close();
        terminalWs = null;
      }
    }

    // Event listeners
    startBtn.addEventListener('click', startTerminalSession);
    stopBtn.addEventListener('click', () => {
      if (terminalWs && terminalWs.readyState === WebSocket.OPEN) {
        // Send Ctrl+C then exit
        terminalWs.send(JSON.stringify({ type: 'input', data: '\x03' }));
        setTimeout(() => {
          terminalWs.send(JSON.stringify({ type: 'input', data: 'exit\r' }));
        }, 100);
      }
      stopTerminalSession();
    });
  </script>
</body>
</html>
